[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rootrewind"
version = "1.1.2"
description = "RootRewind: historical log replay, incident timelines and evidence-based root-cause investigation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sarahsalary"}, {email = "saraasaalari@yahoo.com"}]
maintainers = [{name = "sarahsalary"}, {email = "saraasaalari@yahoo.com"}]
keywords = ["rootrewind", "time-travel-logs", "incident-investigation", "rca", "loki", "opentelemetry", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "pydantic>=2.6,<3",
    "python-dateutil>=2.8.2",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/sarahsalary/time-travel-debugger"
Repository = "https://github.com/sarahsalary/time-travel-debugger"
Issues = "https://github.com/sarahsalary/time-travel-debugger/issues"
Documentation = "https://github.com/sarahsalary/time-travel-debugger#readme"
Changelog = "https://github.com/sarahsalary/time-travel-debugger/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tui = ["textual>=0.80"]
mcp = ["mcp>=1.0"]
evtx = ["python-evtx>=0.7"]
distributed = ["portalocker>=2.8"]
all = ["textual>=0.80", "mcp>=1.0", "python-evtx>=0.7", "portalocker>=2.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2", "twine>=5"]

[project.scripts]
rootrewind = "ttd.cli:main"
ttd = "ttd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ttd*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110
