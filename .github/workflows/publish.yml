name: Publish to PyPI / TestPyPI
on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Choose the destination (TestPyPI first)"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'sarahsalary/time-travel-debugger' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade build twine pytest
      - name: Install and test package
        run: |
          python -m pip install -e .
          python -m pytest
          python -m ttd --help
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
  publish-testpypi:
    needs: build
    if: inputs.registry == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  publish-pypi:
    needs: build
    if: inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
